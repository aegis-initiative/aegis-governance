name: Monthly Release

on:
  schedule:
    - cron: '0 12 1 * *'  # Noon UTC on the 1st of each month
  workflow_dispatch:  # Allow manual trigger for on-demand DOI minting

permissions:
  contents: write

jobs:
  monthly-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute and create monthly release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The monthly tag is always this month's own date: a run on the
          # 1st closes out the month that just ended, and "last month + 1"
          # is mathematically identical to "today's year/month" in every
          # case, including the Dec -> Jan rollover (no special-casing
          # needed). Previously this step only scanned for an existing dev
          # tag from last month and promoted it, so no vYY.M.0 tag was ever
          # actually created -- see aegis-initiative#34.
          YEAR=$(date -u +'%y')
          MONTH=$(date -u +'%-m')
          TAG="v${YEAR}.${MONTH}.0"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            git tag "$TAG" HEAD
            git push origin "$TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Created and pushed tag: $TAG"
          fi

      - name: Get commits for release notes
        if: steps.tag.outputs.skip != 'true'
        id: commits
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Find the previous release tag (not just any tag)
          PREV_RELEASE=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")

          if [ -z "$PREV_RELEASE" ]; then
            COMMITS=$(git log --pretty=format:"- %s" "$TAG")
          else
            COMMITS=$(git log --pretty=format:"- %s" "${PREV_RELEASE}..${TAG}")
          fi

          # Filter out bot commits
          FILTERED=$(echo "$COMMITS" | grep -v "^- docs: dev log entry" | grep -v "^- docs: nightly release" || echo "$COMMITS")

          {
            echo "commits<<COMMITS_EOF"
            echo "$FILTERED"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes via Claude
        if: steps.tag.outputs.skip != 'true'
        id: notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAW_COMMITS: ${{ steps.commits.outputs.commits }}
        run: |
          # Astro site lives in sites/governance/
          NOTES=$(cd sites/governance && python3 scripts/generate-release-notes.py)
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env, never interpolated into the script: the notes are
          # model output built from commit messages, and any quote, backtick
          # or $(...) in them would otherwise break or execute in the shell.
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          gh release create "$TAG" \
            --title "AEGIS™ Governance — ${TAG}" \
            --notes "$NOTES" \
            --latest

          echo "Created release: $TAG"
